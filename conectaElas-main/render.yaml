services:
  - type: web
    name: conecta-elas
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 90 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: COOKIE_SECURE
        value: '1'
      - key: LIA_LOCAL_FALLBACK
        value: '1'
      - key: OLLAMA_URL
        value: https://ollama.com
      - key: OLLAMA_MODEL
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
